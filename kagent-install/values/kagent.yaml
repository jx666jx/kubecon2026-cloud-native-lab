argo-rollouts-agent:
  enabled: false
cilium-debug-agent:
  enabled: false
cilium-manager-agent:
  enabled: false
cilium-policy-agent:
  enabled: false
config:
  server:
    grpcReflection: true
  substrate:
    apiEndpoint: dns:///api.ate-system.svc:443
    routerUrl: https://atenet-router.ate-system.svc:443
controller:
  substrateClientCertificate:
    enabled: true
database:
  postgres:
    clientCertificate:
      enabled: true
harnesses:
  enabled: true
helm-agent:
  enabled: false
istio-agent:
  enabled: false
k8s-agent:
  enabled: false
kgateway-agent:
  enabled: false
observability-agent:
  enabled: false
promql-agent:
  enabled: false
providers:
  azureOpenAI:
    config:
      apiVersion: "2024-10-21"
    model: gpt-5-mini
  default: openAI
  openAI:
    apiKey: ${OPENAI_API_KEY}
    config:
      apiFormat: responses
    model: gpt-5-mini
substrateWorkerPool:
  create: true
  workerImage: ghcr.io/kagent-dev/substrate/ateworker-gvisor:v1.0.1
