apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mimir-rustfs-bucket-access
  namespace: ate-system
spec:
  podSelector:
    matchLabels:
      app: rustfs
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              batch.kubernetes.io/job-name: mimir-rustfs-buckets
      ports:
        - port: 9000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9000
          protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mimir-rustfs-buckets
  namespace: ate-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-buckets
          # This is the same pinned image used by Substrate's RustFS bucket
          # initializer. The previously used minio/mc tag no longer resolves.
          image: amazon/aws-cli:2.38.5@sha256:c8156a0e74e13929a42d7e60f0d4e14e7d28d980cd21822505d4bff80e5460c1
          command: [sh, -ec]
          args:
            - |
              endpoint=http://rustfs.ate-system.svc:9000
              for bucket in mimir-tsdb mimir-ruler mimir-alertmanager; do
                aws --endpoint-url "$endpoint" s3api head-bucket --bucket "$bucket" 2>/dev/null || \
                  aws --endpoint-url "$endpoint" s3api create-bucket --bucket "$bucket"
              done
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: kagent-rustfs-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kagent-rustfs-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: us-east-1
