apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-static
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-static-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  claimRef:
    namespace: coder
    name: coder-postgres
  hostPath:
    path: /var/local/k8s-storage
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-static-rustfs-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  claimRef:
    namespace: ate-system
    name: rustfs-data
  hostPath:
    path: /var/local/k8s-storage-rustfs
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-static-coder-agent
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-static
  claimRef:
    namespace: kagent
    name: kagent-postgresql
  hostPath:
    path: /var/local/k8s-storage-coder-agent
    type: DirectoryOrCreate
